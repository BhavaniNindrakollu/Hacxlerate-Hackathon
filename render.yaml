services:
  - type: web
    name: impostorradar
    env: python
    # Backend only — the React frontend is deployed separately on Vercel and
    # calls this API via VITE_API_URL. To go back to the all-in-one mode
    # (backend also serves the built frontend), restore the frontend build
    # step here: cd frontend && npm install && npm run build && cd ../backend && ...
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: ImpostorRadar
      # Comma-separated allowed browser origins. Set this to your Vercel URL
      # (e.g. https://your-app.vercel.app) plus any custom domains, and keep the
      # localhost entries if you also run the dev server against this backend.
      - key: CORS_ORIGINS
        sync: false
      # Cross-site cookies: the Vercel frontend and this backend are different
      # sites, so the session/CSRF cookies must use SameSite=None (Secure is
      # auto-enabled by ENVIRONMENT=production).
      - key: COOKIE_SAMESITE
        value: "none"
      # Recommended: set these two in the Render dashboard (sync: false asks you
      # for the values on first deploy). They bootstrap the first administrator
      # only while the users table is empty. Never commit real values.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Public self-registration: anyone can create an Analyst account while
      # true. Set to false after your own accounts exist (then plan user
      # creation via the admin Users page).
      - key: ALLOW_SIGNUP
        value: "true"
      # Database. Two supported options (the app works with both unchanged):
      #   A) Hosted Postgres (recommended, survives redeploys without a disk):
      #      paste your Supabase (or Render Postgres) connection URL, e.g.
      #      postgresql://postgres:<password>@db.<project-ref>.supabase.co:5432/postgres?sslmode=require
      #   B) SQLite on the persistent disk below (needs the paid disk; on the
      #      free tier without a disk the filesystem is EPHEMERAL and data is
      #      erased on every deploy/restart).
      # The disk stays mounted either way — uploaded logos and backups are
      # always local files, independent of the database choice.
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: impostorradar-data
      mountPath: /var/data
      sizeGB: 1
